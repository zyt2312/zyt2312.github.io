    <path d="M780 887c117-112 240-138 361-70 99 56 197 55 293-2 91-54 181-40 282 47"/>
  </g>

  <!-- Left research graph. The large centre is deliberately outside the content column. -->
  <g stroke="url(#edge-left)" stroke-width="1.5">
    <path d="M45 390L178 276 328 330 450 198M178 276l45 192 105-138 96 174M45 390l178 78-88 158M223 468l164 178 37-142M135 626l252 20 78 148M387 646l63-142M328 330l122-132"/>
