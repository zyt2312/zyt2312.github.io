    <circle cx="223" cy="468" r="7" fill="#55798a" fill-opacity=".46"/>
    <circle cx="424" cy="504" r="4" fill="#315f50" fill-opacity=".52"/>
    <circle cx="135" cy="626" r="11" fill="#b98d59" fill-opacity=".32"/>
    <circle cx="387" cy="646" r="7" fill="#315f50" fill-opacity=".47"/>
    <circle cx="244" cy="810" r="5" fill="#55798a" fill-opacity=".5"/>
    <circle cx="465" cy="794" r="9" fill="#315f50" fill-opacity=".35"/>
  </g>

  <!-- Right graph: more geometric, suggesting model layers and evaluation paths. -->
  <g stroke="url(#edge-right)" stroke-width="1.5">
    <path d="M1170 115l126 102 134-73 114 132-88 121 119 123-95 115 66 151M1296 217l43 168 117 12M1339 385l-58 147 199 103M1281 532l-98 137 161 127 136-161M1183 669l-77 170M1344 796l-68 176"/>
