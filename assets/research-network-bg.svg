    <circle cx="1296" cy="217" r="5" fill="#315f50" fill-opacity=".48"/>
    <circle cx="1430" cy="144" r="10" fill="#b98d59" fill-opacity=".34"/>
    <circle cx="1544" cy="276" r="6" fill="#55798a" fill-opacity=".55"/>
    <circle cx="1339" cy="385" r="9" fill="#315f50" fill-opacity=".38"/>
