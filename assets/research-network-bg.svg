<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <pattern id="micro-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#315f50" fill-opacity=".11"/>
      <path d="M28 0V56M0 28H56" stroke="#55798a" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge-left" x1="40" y1="120" x2="520" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315f50" stop-opacity=".38"/>
      <stop offset="1" stop-color="#55798a" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="edge-right" x1="1120" y1="180" x2="1560" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55798a" stop-opacity=".1"/>
      <stop offset=".55" stop-color="#55798a" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b98d59" stop-opacity=".28"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#micro-grid)"/>

  <!-- Quiet contour lines: a visual nod to optimization landscapes. -->
  <g stroke="#55798a" stroke-opacity=".11" stroke-width="1.4">
    <path d="M-90 190C78 75 212 82 323 164c97 72 190 74 295 21 102-52 204-45 286 26"/>
    <path d="M-108 224C64 112 194 118 307 196c102 70 202 73 315 17 107-53 207-40 299 35"/>
